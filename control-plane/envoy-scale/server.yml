---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: server
spec:
  replicas: {{.podReplicas}}
  selector:
    matchLabels:
      name: server
  template:
    metadata:
      annotations:
{{ if eq .mesh_mode "sidecar" }}
        sidecar.istio.io/inject: "true"
{{ end }}
      labels:
        name: server
        app: nginx
    spec:
      topologySpreadConstraints:
      - maxSkew: 1 
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway 
        labelSelector: 
          matchLabels:
            app: nginx
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists
              - key: node-role.kubernetes.io/infra
                operator: DoesNotExist
              - key: node-role.kubernetes.io/workload
                operator: DoesNotExist
      containers:
      - image: quay.io/cloud-bulldozer/nginx:latest
        name: server
        resources:
          requests:
            memory: "25Mi"
            cpu: "25m"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP